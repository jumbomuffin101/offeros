name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git diff --check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: .
      - run: npm run lint
      - run: node --test tests/*.test.mjs
      - run: npm run build
        env:
          NEXT_PUBLIC_DATA_MODE: local

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q app
      - run: python -m pytest -q

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: offeros_test
          POSTGRES_USER: offeros
          POSTGRES_PASSWORD: offeros
        options: >-
          --health-cmd "pg_isready -U offeros -d offeros_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://offeros:offeros@localhost:5432/offeros_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Verify one migration head
        run: test "$(alembic heads | wc -l)" -eq 1
      - name: Upgrade clean database to previous head
        run: alembic upgrade 20260727_0017
      - name: Seed pre-0018 user
        run: python -m scripts.verify_career_intelligence_migration --seed
      - name: Upgrade previous head to Career Intelligence head
        run: alembic upgrade 20260730_0018
      - name: Seed pre-0019 mock interview
        run: python -m scripts.verify_mock_interview_intelligence_migration --seed
      - name: Upgrade Career Intelligence head to current head
        run: alembic upgrade head
      - name: Verify current migration
        run: alembic current
      - name: Verify Career Intelligence migration contract
        run: python -m scripts.verify_career_intelligence_migration --verify
      - name: Verify Mock Interview intelligence migration contract
        run: python -m scripts.verify_mock_interview_intelligence_migration --verify
