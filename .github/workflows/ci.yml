name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git diff --check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: .
      - run: npm run lint
      - run: node --test tests/*.test.mjs
      - run: npm run build
        env:
          NEXT_PUBLIC_DATA_MODE: local

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q app
      - run: python -m pytest -q

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: offeros_test
          POSTGRES_USER: offeros
          POSTGRES_PASSWORD: offeros
        options: >-
          --health-cmd "pg_isready -U offeros -d offeros_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://offeros:offeros@localhost:5432/offeros_test
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: offeros_test
      PGUSER: offeros
      PGPASSWORD: offeros
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE"; then
              exit 0
            fi
            sleep 1
          done
          echo "PostgreSQL did not become ready"
          exit 1
      - name: Verify one migration head
        run: test "$(alembic heads | wc -l)" -eq 1

      - name: Prepare clean-upgrade database
        run: psql -v ON_ERROR_STOP=1 -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;'
      - name: Verify clean PostgreSQL upgrade to head
        run: alembic upgrade head
      - name: Confirm clean database reached head
        run: alembic current

      - name: Prepare Career Intelligence 0018 scenario
        run: psql -v ON_ERROR_STOP=1 -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;'
      - name: Upgrade to pre-0018 revision
        run: alembic upgrade 20260727_0017
      - name: Seed deterministic pre-0018 fixtures
        run: python -m scripts.verify_career_intelligence_migration --seed
      - name: Confirm committed pre-0018 fixtures
        run: python -m scripts.verify_career_intelligence_migration --confirm-seed
      - name: Upgrade 0017 to Career Intelligence 0018
        run: alembic upgrade 20260730_0018
      - name: Verify Career Intelligence 0018 migration contract
        run: python -m scripts.verify_career_intelligence_migration --verify

      - name: Prepare Mock Interview 0019 scenario
        run: psql -v ON_ERROR_STOP=1 -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;'
      - name: Upgrade to pre-0019 revision
        run: alembic upgrade 20260730_0018
      - name: Seed deterministic pre-0019 fixtures
        run: python -m scripts.verify_mock_interview_intelligence_migration --seed
      - name: Confirm committed pre-0019 fixtures
        run: python -m scripts.verify_mock_interview_intelligence_migration --confirm-seed
      - name: Upgrade 0018 to Mock Interview 0019
        run: alembic upgrade 20260803_0019
      - name: Verify Mock Interview 0019 migration contract
        run: python -m scripts.verify_mock_interview_intelligence_migration --verify

      - name: Prepare Resume Intelligence 0020 scenario
        run: psql -v ON_ERROR_STOP=1 -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;'
      - name: Upgrade to pre-0020 revision
        run: alembic upgrade 20260803_0019
      - name: Seed deterministic pre-0020 fixtures
        run: python -m scripts.verify_resume_intelligence_migration --seed
      - name: Confirm committed pre-0020 fixtures
        run: python -m scripts.verify_resume_intelligence_migration --confirm-seed
      - name: Upgrade 0019 to Resume Intelligence 0020
        run: alembic upgrade 20260804_0020
      - name: Verify Resume Intelligence 0020 migration contract
        run: python -m scripts.verify_resume_intelligence_migration --verify
      - name: Prepare Behavioral Coach 0021 scenario
        run: python -m scripts.prepare_migration_database
      - name: Upgrade to pre-0021 revision
        run: alembic upgrade 20260804_0020
      - name: Seed deterministic pre-0021 fixtures
        run: python -m scripts.verify_behavioral_coach_migration --seed
      - name: Confirm committed pre-0021 fixtures
        run: python -m scripts.verify_behavioral_coach_migration --confirm-seed
      - name: Upgrade 0020 to Behavioral Coach 0021
        run: alembic upgrade 20260805_0021
      - name: Verify Behavioral Coach 0021 migration contract
        run: python -m scripts.verify_behavioral_coach_migration --verify
      - name: Confirm final revision and single head
        run: |
          alembic current
          test "$(alembic heads | wc -l)" -eq 1
